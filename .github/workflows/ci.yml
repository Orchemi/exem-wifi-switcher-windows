name: Prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Source and script checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Core tests
        run: dotnet test tests/WifiProfileSwitcher.Core.Tests -c Release
      - name: Mocked network backend tests (no network changes)
        shell: pwsh
        run: ./tests/NetworkBackend.Tests.ps1
      - name: Windows package
        shell: pwsh
        run: ./scripts/package-setup.ps1
      - name: Setup executable payload and native controls smoke test
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ./Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $exe = (Resolve-Path "./dist/WifiProfileSwitcher-Setup-$version.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--verify-package' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Setup payload or native controls failed' }
      - name: Capture native settings with example data only
        shell: pwsh
        run: |
          $version = ([xml](Get-Content ./Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $exe = (Resolve-Path "./dist/WifiProfileSwitcher-Setup-$version.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--capture-ui', 'dist/ui' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Native preview capture failed' }
      - name: Read-only Windows smoke test
        shell: pwsh
        run: |
          & ./dist/win-x64/WifiProfileSwitcher.exe help
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }
          & ./dist/win-x64/WifiProfileSwitcher.exe validate --config ./config.example.json
          if ($LASTEXITCODE -ne 0) { throw 'validate failed' }
          & ./dist/win-x64/WifiProfileSwitcher.exe doctor
          if ($LASTEXITCODE -ne 0) { throw 'doctor failed' }
          & ./dist/win-x64/WifiProfileSwitcher.exe observe --config ./config.example.json
          if ($LASTEXITCODE -ne 0) { throw 'observe failed' }
      - name: Windows PowerShell 5.1 backend tests
        shell: powershell
        run: ./tests/NetworkBackend.Tests.ps1
      - name: Protected installation and observe-only service lifecycle
        shell: powershell
        run: ./tests/WindowsLifecycle.Tests.ps1 -PackagePath ./dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-prototype-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
            dist/ui/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ui-screenshots
          path: dist/ui/*.png
          retention-days: 14
